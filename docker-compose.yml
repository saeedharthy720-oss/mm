services:
  postgres:
    image: postgres:16-alpine
    container_name: bms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms_dev_password
      POSTGRES_DB: building_materials_store
    ports:
      - "5432:5432"
    volumes:
      - bms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms -d building_materials_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bms_postgres_data:
