# Netlify config for the customer storefront.
# In the Netlify UI set the site's base directory to: apps/web

[build]
  base = "apps/web"
  # --include=dev: the build needs vite, typescript and tailwind, which are all
  # devDependencies. Netlify skips those if NODE_ENV=production is ever set.
  command = "npm install --include=dev --prefix ../.. && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The API is on a different host entirely, so nothing here should ever answer
# /api/*. This rule must stay ABOVE the SPA catch-all: without it, a bundle built
# without VITE_API_BASE_URL sends relative /api/* calls that the catch-all
# answers with index.html at status 200, and the app parses HTML as JSON.
[[redirects]]
  from = "/api/*"
  to = "/api-not-hosted-here"
  status = 404
  force = true

# React Router handles routing client-side, so every path must serve index.html.
# Without this, refreshing on /products/123 would 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
