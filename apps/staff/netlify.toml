# The staff dashboard is no longer hosted on its own domain — it is served from
# /admin on the storefront's site (see the netlify.toml at the repository root).
#
# This config exists only to keep the old bms-staff.netlify.app address working:
# it publishes a placeholder and redirects every path to the new location, so
# bookmarks and saved links don't simply break.
#
# The dashboard itself is built by `npm run build:site` at the root.

[build]
  base = "apps/staff"
  command = "mkdir -p dist && printf '<!doctype html><meta charset=utf-8><title>Moved</title>' > dist/index.html"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "https://bms-store.netlify.app/admin/:splat"
  status = 301
  force = true
