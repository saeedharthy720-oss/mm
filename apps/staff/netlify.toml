# Netlify config for the staff dashboard.
# In the Netlify UI set the site's base directory to: apps/staff

[build]
  base = "apps/staff"
  command = "npm install --prefix ../.. && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# React Router handles routing client-side, so every path must serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The staff dashboard should never be indexed by search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
