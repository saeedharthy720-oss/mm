# Render blueprint for the API.
# The database lives on Neon (free tier) rather than Render, because Render's own
# free Postgres instances are deleted after 30 days.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Then fill in the env vars marked sync:false in the Render UI.

services:
  - type: web
    name: bms-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/api
    # Install from the workspace root so the monorepo packages resolve, then
    # generate the client, apply migrations, seed lookup data, and compile.
    # Migrations/seed run here rather than in preDeployCommand because that
    # field requires a paid instance type. `migrate deploy` only applies
    # committed migrations and never prompts; the seed is idempotent (upserts).
    # --include=dev is required: NODE_ENV=production (set below, for runtime)
    # would otherwise make npm skip devDependencies, and the build needs
    # typescript, tsx and the prisma CLI from there.
    buildCommand: >-
      npm install --include=dev --prefix ../.. &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npx prisma db seed &&
      npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # Neon POOLED connection string (host contains "-pooler").
      - key: DATABASE_URL
        sync: false

      # Neon DIRECT connection string — the same value with "-pooler" removed
      # from the host. Prisma migrations fail through the pooler.
      - key: DIRECT_URL
        sync: false

      # Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      # Host-only cookies: the API and frontends are on different domains,
      # so no shared parent domain can be set.
      - key: COOKIE_DOMAIN
        value: localhost

      # Comma-separated Netlify URLs of the two frontends, e.g.
      # https://your-store.netlify.app,https://your-staff.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Product images/video — Render's disk is ephemeral on the free plan, so
      # uploads must go to object storage. Configured for Supabase Storage,
      # which speaks S3 and has a free tier with no card required.
      - key: STORAGE_PROVIDER
        value: s3
      # https://<project-ref>.supabase.co/storage/v1/s3
      - key: STORAGE_S3_ENDPOINT
        sync: false
      # Must match the Supabase project's region, e.g. eu-central-1
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      # https://<project-ref>.supabase.co/storage/v1/object/public/<bucket>
      - key: STORAGE_S3_PUBLIC_BASE_URL
        sync: false

      # Thawani (leave blank until you have sandbox keys — card checkout will
      # return a clear error, pay-on-delivery keeps working).
      - key: THAWANI_API_KEY
        sync: false
      - key: THAWANI_PUBLISHABLE_KEY
        sync: false
      - key: THAWANI_BASE_URL
        value: https://uatcheckout.thawani.om/api/v1

      - key: WHATSAPP_STORE_NUMBER
        sync: false

      # First-run staff accounts. SEED_ADMIN_PASSWORD is required in production —
      # the seed refuses to fall back to the public default password.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_EMPLOYEE_EMAIL
        sync: false
      - key: SEED_EMPLOYEE_PASSWORD
        sync: false
